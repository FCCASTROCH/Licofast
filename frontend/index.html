<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>LicoFast</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap;">
                <strong>🍾 LicoFast</strong>
                <div style="display:flex;align-items:center;gap:6px;font-size:13px;">
                    <label for="backendSelect" style="color:#ccc;">Backend:</label>
                    <select id="backendSelect" style="padding:4px 8px;font-size:13px;border-radius:6px;background:#241d2a;color:#fff;border:1px solid #5a4b66;cursor:pointer;">
                        <option value="http://localhost/LicoFast1/backend-php/api">PHP (LicoFast1)</option>
                        <option value="http://localhost/LicoFast/backend-php/api">PHP (LicoFast)</option>
                        <option value="http://localhost:8080/api">Java (Spring Boot :8080)</option>
                        <option value="http://localhost:5000/api">Python (Flask :5000)</option>
                    </select>
                    <span id="backendLabel"></span>
                </div>
            </div>
            <nav>
                <button id="logout" hidden>Cerrar sesión</button>
            </nav>
        </header>
        <main>
            <section id="loginView" class="card">
                <h1>Iniciar sesión</h1>
                <form id="loginForm">
                    <input id="loginUser" placeholder="Usuario" required>
                    <input id="loginPass" type="password" placeholder="Contraseña" required>
                    <button>Entrar</button>
                </form>
                <p>Usuario de prueba API: <b>admin_api</b> / <b>Admin1234</b></p>
                <p id="loginMsg"></p>
            </section>
            <section id="appView" hidden>
                <div class="toolbar">
                    <h1 id="welcome"></h1>
                    <div>
                        <button onclick="showTab('clientes')" id="btnClientes">Clientes</button>
                        <button onclick="showTab('productos')" id="btnProductos">Productos</button>
                        <button onclick="showTab('tienda')" id="btnTienda">Tienda</button>
                        <button onclick="showTab('ventas')" id="btnVentas">Ventas</button>
                        <button onclick="showTab('entregas')" id="btnEntregas">Entregas</button>
                    </div>
                </div>
                <div id="content"></div>
            </section>
        </main>
        <script src="js/config.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
